[project]
name = "mocholink"
version = "0.1.0"
description = "Acortador de URLs MochoLink"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
frontend = [
    "httpx>=0.28.1",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.10",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
